terms:
  - term: spatial reference system
    definition: >
      A system for establishing spatial positioning. A spatial reference system can use geographic
      identifiers (place names, for example), coordinates (in which case it is a coordinate
      reference system), or identifiers with structured geometry (in which case it is a discrete
      global grid system).
  - term: coordinate system
    definition: >
      A set of mathematical rules for specifying how coordinates are to be assigned to points.
  - term: datum
    definition: >
      A parameter, or set of parameters, that define the position of the origin, the scale, and
      the orientation of a coordinate system.
  - term: coordinate reference system
    definition: >
      A coordinate system that is related to an object by a datum.
  - term: example term
    definition: term used for exemplary purposes
    sources:
      - title: ISO 19101-1
    note: An example note.

abbreviated-terms:
  CRS: coordinate reference system
  SRS: spatial reference system
